<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Produto — Catálogo Online</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,wght@0,500;0,600;0,700;1,500&family=Manrope:wght@400;500;600;700;800&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet">

<link rel="stylesheet" href="style.css">
</head>
<body data-pagina="produto">

  <div id="tela-carregamento">
    <div class="spinner"></div>
    <p>Carregando produto...</p>
  </div>

  <!-- ==================== CABEÇALHO (mesma estrutura do index) ==================== -->
  <header class="cabecalho">
    <div class="container cabecalho-topo">
      <a href="index.html" class="marca">
        <img data-loja-logo src="fotos/logo.png" alt="Logo da loja" onerror="this.style.display='none'">
        <div>
          <div class="marca-nome" data-loja-nome>Carregando...</div>
          <div class="marca-slogan" data-loja-slogan></div>
        </div>
      </a>
      <div class="busca-container">
        <span class="busca-icone">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4.3-4.3"/></svg>
        </span>
        <input type="text" class="busca-input" placeholder="Buscar no catálogo..." onfocus="window.location.href='index.html'" readonly>
      </div>
      <div class="acoes-cabecalho">
        <button class="botao-icone" id="botao-tema" aria-label="Alternar modo claro/escuro" title="Alternar tema"></button>
        <a class="botao-icone" href="index.html" aria-label="Voltar ao catálogo" title="Voltar ao catálogo">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M19 12H5M12 19l-7-7 7-7"/></svg>
        </a>
      </div>
    </div>
  </header>

  <div id="area-aviso"></div>

  <main class="container">
    <p class="trilha-navegacao"><a href="index.html">Início</a> / <span id="trilha-nome-produto">Produto</span></p>

    <div class="produto-detalhe" id="area-produto">
      <!-- Preenchido dinamicamente pelo script.js -->
    </div>

    <!-- ==================== PRODUTOS RELACIONADOS ==================== -->
    <section class="relacionados">
      <div class="secao-cabecalho">
        <div>
          <span class="eyebrow">Combine também</span>
          <h2 class="secao-titulo">Produtos relacionados</h2>
        </div>
      </div>
      <div class="grade-produtos" id="grade-relacionados"></div>
    </section>
  </main>

  <!-- ==================== RODAPÉ ==================== -->
  <footer class="rodape">
    <div class="container">
      <div class="rodape-grade">
        <div>
          <h4 data-loja-nome></h4>
          <p data-loja-slogan></p>
          <div class="redes-sociais">
            <a data-loja-instagram href="#" target="_blank" rel="noopener" aria-label="Instagram">
              <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="18" height="18" rx="5"/><circle cx="12" cy="12" r="4"/><circle cx="17.5" cy="6.5" r="1"/></svg>
            </a>
            <a data-loja-facebook href="#" target="_blank" rel="noopener" aria-label="Facebook">
              <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M18 2h-3a5 5 0 00-5 5v3H7v4h3v8h4v-8h3l1-4h-4V7a1 1 0 011-1h3z"/></svg>
            </a>
            <a data-loja-whatsapp href="#" target="_blank" rel="noopener" aria-label="WhatsApp">
              <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 2a10 10 0 00-8.6 15.1L2 22l5-1.3A10 10 0 1012 2z"/></svg>
            </a>
          </div>
        </div>
        <div>
          <h4>Atendimento</h4>
          <p data-loja-email></p>
          <p data-loja-endereco></p>
        </div>
        <div>
          <h4>Institucional</h4>
          <a href="admin.html">Área do lojista</a>
          <a href="index.html">Voltar ao catálogo</a>
        </div>
      </div>
      <p class="rodape-baixo">© <span id="ano-atual"></span> <span data-loja-nome></span>. Todos os direitos reservados.</p>
    </div>
  </footer>

  <button class="botao-topo" id="botao-topo" aria-label="Voltar ao topo">
    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 19V5M5 12l7-7 7 7"/></svg>
  </button>
  <a class="whatsapp-flutuante" data-loja-whatsapp-flutuante href="#" target="_blank" rel="noopener" aria-label="Fale conosco pelo WhatsApp">
    <svg width="26" height="26" viewBox="0 0 24 24" fill="currentColor"><path d="M12 2a10 10 0 00-8.6 15.1L2 22l5-1.3A10 10 0 1012 2zm0 18.2a8.2 8.2 0 01-4.2-1.2l-.3-.2-3 .8.8-2.9-.2-.3A8.2 8.2 0 1112 20.2z"/></svg>
  </a>

  <!-- Modal de compartilhamento -->
  <div class="modal-fundo" id="modal-compartilhar">
    <div class="modal-caixa">
      <button class="modal-fechar botao-icone" data-fechar-modal aria-label="Fechar">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M18 6L6 18M6 6l12 12"/></svg>
      </button>
      <h3>Compartilhar produto</h3>
      <div class="opcoes-compartilhar" id="opcoes-compartilhar"></div>
    </div>
  </div>

  <script src="script.js"></script>
  <script>document.getElementById('ano-atual').textContent = new Date().getFullYear();</script>
</body>
</html>
